# netlify.toml — Configuration for Certificate System on Netlify
# ═══════════════════════════════════════════════════════════════════════
# v2.0 — Supabase Backend + GAS Drive Proxy

[build]
  publish = "."

# ═══════════════════════════════════════════════════════════════════════
# GAS Proxy → Google Apps Script (เฉพาะ Google Drive operations)
# ═══════════════════════════════════════════════════════════════════════
# Auth + CRUD ใช้ Supabase ตรง (ไม่ผ่าน proxy)
# เฉพาะ upload/download ไฟล์ Drive ยังใช้ GAS

[[redirects]]
  from = "/gas-api"
  to = "https://script.google.com/macros/s/AKfycbwmLI7XIgrIc-foqX2xaJAzPoGpSI7BD-LhHLJ1znLYWh0kqg7aepLb0dmr4zLxseYQ/exec"
  status = 200
  force = true

# ═══════════════════════════════════════════════════════════════════════
# Cache Control สำหรับ Static Assets
# ═══════════════════════════════════════════════════════════════════════

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ═══════════════════════════════════════════════════════════════════════
# Security Headers
# ═══════════════════════════════════════════════════════════════════════

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
